<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品售卖平台 - 首页</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .search-section {
            background: #fff;
            padding: 30px 0;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #1890ff;
            border-radius: 4px;
            font-size: 16px;
        }

        .search-btn {
            padding: 10px 30px;
            background: #1890ff;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }

        .filter-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
        }

        .sort-options {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .sort-btn {
            padding: 8px 16px;
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            cursor: pointer;
        }

        .sort-btn.active {
            background: #1890ff;
            color: #fff;
            border-color: #1890ff;
        }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">🛒 商城</div>
            <nav class="nav-menu">
                <a href="index.html" class="active">首页</a>
                <a href="cart.html">购物车</a>
                <a href="orders.html">我的订单</a>
                <a href="profile.html">个人中心</a>
            </nav>
            <div class="header-actions">
                <div class="cart-icon" onclick="location.href='cart.html'">
                    🛒
                    <span class="cart-badge" style="display: none;">0</span>
                </div>
                <div class="user-info" id="userInfo">
                    <button class="btn btn-primary" onclick="location.href='login.html'">登录</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 搜索区域 -->
    <section class="search-section">
        <div class="container">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索商品...">
                <button class="search-btn" onclick="searchProducts()">搜索</button>
            </div>
            <div class="filter-section">
                <div class="filter-group">
                    <label>分类：</label>
                    <select id="categoryFilter" class="filter-select" onchange="applyFilters()">
                        <option value="">全部</option>
                        <option value="手机">手机</option>
                        <option value="电脑">电脑</option>
                        <option value="耳机">耳机</option>
                        <option value="平板">平板</option>
                        <option value="家电">家电</option>
                        <option value="游戏">游戏</option>
                        <option value="外设">外设</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>品牌：</label>
                    <select id="brandFilter" class="filter-select" onchange="applyFilters()">
                        <option value="">全部</option>
                        <option value="Apple">Apple</option>
                        <option value="华为">华为</option>
                        <option value="小米">小米</option>
                        <option value="Sony">Sony</option>
                        <option value="Dyson">Dyson</option>
                        <option value="Nintendo">Nintendo</option>
                        <option value="Logitech">Logitech</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>价格区间：</label>
                    <input type="number" id="minPrice" class="filter-select" placeholder="最低价" style="width: 100px;" onchange="applyFilters()">
                    <span>-</span>
                    <input type="number" id="maxPrice" class="filter-select" placeholder="最高价" style="width: 100px;" onchange="applyFilters()">
                </div>
            </div>
        </div>
    </section>

    <!-- 排序选项 -->
    <section class="container">
        <div class="sort-options">
            <button class="sort-btn active" data-sort="createdAt" data-order="desc" onclick="changeSort(this)">综合排序</button>
            <button class="sort-btn" data-sort="price" data-order="asc" onclick="changeSort(this)">价格从低到高</button>
            <button class="sort-btn" data-sort="price" data-order="desc" onclick="changeSort(this)">价格从高到低</button>
            <button class="sort-btn" data-sort="salesCount" data-order="desc" onclick="changeSort(this)">销量最高</button>
            <button class="sort-btn" data-sort="rating" data-order="desc" onclick="changeSort(this)">评分最高</button>
        </div>
    </section>

    <!-- 商品列表 -->
    <main class="container" style="margin: 30px auto; min-height: 500px;">
        <div id="productList" class="grid grid-4">
            <!-- 商品将通过JS动态加载 -->
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination" style="display: none;">
            <button onclick="changePage('prev')">上一页</button>
            <span id="pageInfo">第 1 页</span>
            <button onclick="changePage('next')">下一页</button>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentFilters = {};

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkUserLogin();
            loadProducts();

            // 搜索框回车事件
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchProducts();
                }
            });
        });

        // 检查用户登录状态
        function checkUserLogin() {
            const userInfo = getUserInfo();
            const userInfoEl = document.getElementById('userInfo');
            
            if (userInfo) {
                userInfoEl.innerHTML = `
                    <img src="${userInfo.avatar || 'https://via.placeholder.com/32'}" class="user-avatar" alt="头像">
                    <span>${userInfo.username}</span>
                    <button class="btn btn-default" onclick="logout()">退出</button>
                `;
                // 加载购物车数量
                loadCartCount();
            }
        }

        // 加载购物车数量
        async function loadCartCount() {
            try {
                const result = await cartAPI.get();
                if (result && result.code === 0) {
                    const count = result.data.items.length;
                    updateCartCount(count);
                }
            } catch (error) {
                console.error('加载购物车失败:', error);
            }
        }

        // 加载商品列表
        async function loadProducts() {
            showLoading();
            try {
                const params = {
                    page: currentPage,
                    pageSize: 20,
                    ...currentFilters
                };

                const result = await productAPI.search(params);
                hideLoading();

                if (result && result.code === 0) {
                    renderProducts(result.data.products);
                    updatePagination(result.data);
                } else {
                    showMessage(result?.message || '加载商品失败', 'error');
                }
            } catch (error) {
                hideLoading();
                showMessage('加载商品失败', 'error');
                console.error(error);
            }
        }

        // 渲染商品列表
        function renderProducts(products) {
            const productList = document.getElementById('productList');
            
            if (!products || products.length === 0) {
                productList.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📦</div>
                        <p>暂无商品</p>
                    </div>
                `;
                return;
            }

            productList.innerHTML = products.map(product => `
                <div class="product-card" onclick="viewProduct('${product.productId}')">
                    <img src="${product.images[0]}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <h3 class="product-name" title="${product.name}">${product.name}</h3>
                        <p style="color: #999; font-size: 12px; margin: 5px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${product.description}
                        </p>
                        <div style="margin: 10px 0;">
                            <span class="rating">${renderStars(product.rating || 0)}</span>
                            <span style="color: #999; font-size: 12px; margin-left: 5px;">
                                ${product.rating || 0} (${product.salesCount || 0}人付款)
                            </span>
                        </div>
                        <div>
                            <span class="product-price">${formatPrice(product.price)}</span>
                            ${product.originalPrice ? `<span class="product-original-price">${formatPrice(product.originalPrice)}</span>` : ''}
                        </div>
                        <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="event.stopPropagation(); addToCart('${product.productId}')">
                            加入购物车
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 更新分页
        function updatePagination(data) {
            const pagination = document.getElementById('pagination');
            const pageInfo = document.getElementById('pageInfo');
            
            totalPages = Math.ceil(data.total / data.pageSize);
            
            if (totalPages > 1) {
                pagination.style.display = 'flex';
                pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
            } else {
                pagination.style.display = 'none';
            }
        }

        // 翻页
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
                loadProducts();
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
                loadProducts();
            }
        }

        // 搜索商品
        function searchProducts() {
            const keyword = document.getElementById('searchInput').value;
            currentFilters.keyword = keyword;
            currentPage = 1;
            loadProducts();
        }

        // 应用筛选
        function applyFilters() {
            const category = document.getElementById('categoryFilter').value;
            const brand = document.getElementById('brandFilter').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;

            currentFilters = {
                ...currentFilters,
                category: category || undefined,
                brand: brand || undefined,
                minPrice: minPrice || undefined,
                maxPrice: maxPrice || undefined
            };

            currentPage = 1;
            loadProducts();
        }

        // 改变排序
        function changeSort(btn) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentFilters.sortBy = btn.dataset.sort;
            currentFilters.sortOrder = btn.dataset.order;
            currentPage = 1;
            loadProducts();
        }

        // 查看商品详情
        function viewProduct(productId) {
            location.href = `product.html?id=${productId}`;
        }

        // 添加到购物车
        async function addToCart(productId) {
            if (!getToken()) {
                showMessage('请先登录', 'warning');
                setTimeout(() => location.href = 'login.html', 1000);
                return;
            }

            try {
                const result = await cartAPI.addItem(productId, 1);
                if (result && result.code === 0) {
                    showMessage('已添加到购物车', 'success');
                    loadCartCount();
                } else {
                    showMessage(result?.message || '添加失败', 'error');
                }
            } catch (error) {
                showMessage('添加失败', 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
